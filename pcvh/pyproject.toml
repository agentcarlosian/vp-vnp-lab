[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pcvh"
version = "0.1.0"
description = "Agentic Proof-Carrying Verification Harness — Palomar-style zero-trust Lean 4 verification gate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "cryptography>=42.0"]
crypto = ["cryptography>=42.0"]

[project.scripts]
pcvh = "pcvh.cli:main"

[tool.setuptools.packages.find]
include = ["pcvh*"]
