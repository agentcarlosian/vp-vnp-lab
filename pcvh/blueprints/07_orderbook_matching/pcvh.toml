[spec]
name = "blueprint07-limit-orderbook-and-margin"
lean_toolchain = "leanprover/lean4:v4.33.1"
statement = "Specs/OrderBook/Statement.lean"
challenge = "Specs/OrderBook/Challenge.lean"
challenge_module = "Specs.OrderBook.Challenge"
solution_module = "Solution"
allowed_axioms = ["propext", "Classical.choice", "Quot.sound"]
require_nonvacuity_witness = true
nonvacuity_suffix = "nonvacuous"

[target]
language = "rust"
template = "orderbook"

[falsification]
enabled = true
lean_samples = 64

[agent_loop]
max_rounds_per_lemma = 8
max_token_budget_usd = 5.0
auto_lake_shake = true
forbid_umbrella_imports = ["Mathlib", "Mathlib.Tactic", "Mathlib.All"]

[conformance]
traces = 1000
transcript_sha256 = "0439082b3b4182bf7a8b036875305e27153d65d066c14300398674ff2b1738d6"
command = "python conformance_fuzz.py --traces 1000"
