[spec]
name = "blueprint03-ast-peephole-optimizer"
lean_toolchain = "leanprover/lean4:v4.33.1"
statement = "Specs/IrOpt/Statement.lean"
challenge = "Specs/IrOpt/Challenge.lean"
challenge_module = "Specs.IrOpt.Challenge"
solution_module = "Solution"
allowed_axioms = ["propext", "Classical.choice", "Quot.sound"]
require_nonvacuity_witness = true
nonvacuity_suffix = "nonvacuous"

[falsification]
enabled = true
lean_samples = 48

[agent_loop]
max_rounds_per_lemma = 6
max_token_budget_usd = 2.0
forbid_umbrella_imports = ["Mathlib", "Mathlib.Tactic", "Mathlib.All"]
auto_lake_shake = true

[conformance]
command = "python conformance_fuzz.py --traces 500"
