[spec]
name = "blueprint02-bft-consensus-merkle"
lean_toolchain = "leanprover/lean4:v4.33.1"
statement = "Specs/Bft/Statement.lean"
challenge = "Specs/Bft/Challenge.lean"
challenge_module = "Specs.Bft.Challenge"
solution_module = "Solution"
allowed_axioms = ["propext", "Classical.choice", "Quot.sound"]
require_nonvacuity_witness = true
nonvacuity_suffix = "nonvacuous"

[falsification]
enabled = true
lean_samples = 48

[agent_loop]
forbid_umbrella_imports = ["Mathlib", "Mathlib.Tactic", "Mathlib.All"]

[conformance]
command = "python conformance_fuzz.py --traces 500"
