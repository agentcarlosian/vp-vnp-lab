name: VP-VNP Lab & PCVH CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lean-orch-and-qcat0:
    name: lean-build-orchestrator & quantum-cat0-checker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install elan & Lean 4.33.1
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy cvxpy networkx psutil

      - name: Test lean-build-orchestrator (8 tests incl. live Lean 4.33.1)
        working-directory: lean-build-orchestrator
        run: python -m pytest -v tests/test_lean_orch.py

      - name: Test quantum-cat0-checker (8 CVXPY SOCP/SDP tests)
        working-directory: quantum-cat0-checker
        run: python -m pytest -v tests/test_quantum_cat0.py

  pcvh-palomar-blueprints:
    name: PCVH Palomar Gate (${{ matrix.blueprint }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        blueprint:
          - 01_erc4626_vault
          - 02_bft_consensus
          - 03_ssa_peephole_opt
          - 04_double_entry_ledger
          - 05_cat0_certificate
    steps:
      - uses: actions/checkout@v4

      - name: Install elan & Lean 4.33.1
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography

      - name: Run Zero-Trust Palomar Verification Gate
        working-directory: pcvh
        run: |
          python -m pcvh verify blueprints/${{ matrix.blueprint }} --attestation blueprints/${{ matrix.blueprint }}/proof-attestation.json

      - name: Publish Step Summary Badge
        working-directory: pcvh
        run: |
          python -c "import json, pathlib; d = json.loads(pathlib.Path('blueprints/${{ matrix.blueprint }}/proof-attestation.json').read_text()); print(f'### ${{ matrix.blueprint }}: **{d[\"verdict\"]}**\n- Spec SHA256: \`{d[\"spec_bundle_sha256\"][:16]}...\`\n- Verified Theorems ({len(d[\"verified_theorems\"])}): \`{d[\"verified_theorems\"]}\`\n- Axioms: \`{d[\"axioms_used\"]}\`')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Signed Proof Attestation
        uses: actions/upload-artifact@v4
        with:
          name: attestation-${{ matrix.blueprint }}
          path: pcvh/blueprints/${{ matrix.blueprint }}/proof-attestation.json

  pcvh-full-suite:
    name: PCVH Full Suite (25 tests: Red-Team, LSP, Prover, CAT(0), Eval-40)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install elan & Lean 4.33.1
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy cvxpy psutil cryptography

      - name: Run full PCVH test suite
        working-directory: pcvh
        run: |
          python -m pytest -v tests/

  pcvh-dual-kernel-nanoda:
    name: PCVH Dual-Kernel (lean4export + nanoda) & Ed25519 Signing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install elan & Lean 4.33.1
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography

      - name: Cache & build independent lean4export + nanoda kernel tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/lean-ci-tools
          key: lean-ci-tools-v4.33.1-nanoda-68d5ca9d

      - name: Build lean4export & nanoda_bin
        run: |
          bash scripts/setup_dual_kernel_ci.sh
          echo "$HOME/.cache/lean-ci-tools/bin" >> "$GITHUB_PATH"

      - name: Verify blueprints under dual kernels + Ed25519 DSSE signing
        working-directory: pcvh
        run: |
          python -m pcvh keygen --out-dir /tmp/pcvh-ci-keys
          for bp in 01_erc4626_vault 02_bft_consensus 03_ssa_peephole_opt 04_double_entry_ledger 05_cat0_certificate; do
            echo "=== Dual-Kernel Verifying $bp ==="
            python -m pcvh verify "blueprints/$bp" \
              --require-dual-kernel \
              --sign-key /tmp/pcvh-ci-keys/pcvh_signing.key.pem \
              --attestation "blueprints/$bp/proof-attestation.json"
            python -m pcvh verify-sig "blueprints/$bp/proof-attestation.json" \
              --pubkey /tmp/pcvh-ci-keys/pcvh_signing.pub.pem
          done
