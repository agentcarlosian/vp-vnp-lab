name: VP-VNP Lab & PCVH CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check isolated verification against an independent pin
        working-directory: pcvh
        run: |
          python -m pip install pytest cryptography
          docker build -f Dockerfile.verifier -t pcvh-verifier:test .
          export PCVH_TEST_IMAGE=$(docker image inspect pcvh-verifier:test --format '{{.Id}}')
          python -m pytest -q tests/test_verification_boundary.py

  pcvh-installed-wheel:
    name: PCVH installed-wheel Studio smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python scripts/check_studio_wheel.py

  lean-orch-windows:
    name: lean-orch native Windows smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install and check Lean 4.33.1
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'lean-4.33.1-windows.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'lean-win'
          curl.exe --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-windows.zip --output $zip
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the pinned Lean toolchain' }
          Expand-Archive -Path $zip -DestinationPath $dest
          $lean = @(Get-ChildItem -Path $dest -Recurse -File -Filter lean.exe | Where-Object {
            Test-Path (Join-Path $_.DirectoryName 'lake.exe')
          })
          if ($lean.Count -ne 1) { throw 'Could not uniquely locate lean.exe and lake.exe' }
          $bin = $lean[0].DirectoryName
          $version = & $lean[0].FullName --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch 'version 4\.33\.1(,|\s|$)') { throw "Unexpected Lean version: $version" }
          "PCVH_LEAN_BIN=$bin" >> $env:GITHUB_ENV
      - name: Check native commit telemetry and miniature Lean builds
        working-directory: lean-build-orchestrator
        run: |
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { throw 'lean-orch installation failed' }
          python -m pytest -q -rs tests/test_lean_orch.py

  lean-orch-and-qcat0:
    name: lean-build-orchestrator & quantum-cat0-checker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install elan & Lean 4.33.1
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy cvxpy networkx psutil

      - name: Test lean-build-orchestrator (including live Lean 4.33.1)
        working-directory: lean-build-orchestrator
        run: python -m pytest -v tests/test_lean_orch.py

      - name: Test quantum-cat0-checker (CVXPY, verdicts and Lean certificates)
        working-directory: quantum-cat0-checker
        run: python -m pytest -v tests/test_quantum_cat0.py

  pcvh-palomar-blueprints:
    name: PCVH Palomar Gate (${{ matrix.blueprint }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        blueprint:
          - 01_erc4626_vault
          - 02_bft_consensus
          - 03_ssa_peephole_opt
          - 04_double_entry_ledger
          - 05_cat0_certificate
          - 06_agent_tool_guard
          - 07_orderbook_matching
          - 08_zk_and_replay_window
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install elan & Lean 4.33.1
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography

      - name: Run Zero-Trust Palomar Verification Gate
        working-directory: pcvh
        run: |
          python -m pcvh verify --trusted-local blueprints/${{ matrix.blueprint }} --attestation blueprints/${{ matrix.blueprint }}/proof-attestation.json

      - name: Publish Step Summary Badge
        working-directory: pcvh
        env:
          BP_NAME: ${{ matrix.blueprint }}
        run: |
          python - << 'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          bp = os.environ["BP_NAME"]
          d = json.loads(pathlib.Path(f"blueprints/{bp}/proof-attestation.json").read_text())
          print(f"### {bp}: **{d['verdict']}**")
          print(f"- Spec SHA256: `{d['spec_bundle_sha256'][:16]}...`")
          print(f"- Verified Theorems ({len(d['verified_theorems'])}): `{d['verified_theorems']}`")
          print(f"- Axioms: `{d['axioms_used']}`")
          PY

      - name: Upload proof attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: attestation-${{ matrix.blueprint }}
          path: pcvh/blueprints/${{ matrix.blueprint }}/proof-attestation.json

  pcvh-full-suite:
    name: "PCVH native suite (proof gate, LSP, prover, conformance and Eval-40)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install elan & Lean 4.33.1
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy cvxpy networkx psutil cryptography

      - name: Run full PCVH test suite
        working-directory: pcvh
        run: |
          python -m pytest -v tests/

  pcvh-dual-kernel-nanoda:
    name: PCVH Dual-Kernel (lean4export + nanoda) & Ed25519 Signing
    env:
      BLUEPRINTS: 01_erc4626_vault 02_bft_consensus 03_ssa_peephole_opt 04_double_entry_ledger 05_cat0_certificate 06_agent_tool_guard 07_orderbook_matching 08_zk_and_replay_window
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install elan & Lean 4.33.1
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography

      - name: Cache & build independent lean4export + nanoda kernel tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/lean-ci-tools
          key: lean-ci-tools-v4.33.1-nanoda-68d5ca9d

      - name: Build lean4export & nanoda_bin
        run: |
          bash scripts/setup_dual_kernel_ci.sh
          echo "$HOME/.cache/lean-ci-tools/bin" >> "$GITHUB_PATH"

      - name: Verify blueprints under dual kernels
        working-directory: pcvh
        run: |
          evidence="$RUNNER_TEMP/pcvh-dual-kernel"
          mkdir -p "$evidence"
          for bp in $BLUEPRINTS; do
            echo "=== Dual-Kernel Verifying $bp ==="
            mkdir -p "$evidence/$bp"
            python -m pcvh verify --trusted-local "blueprints/$bp" \
              --require-dual-kernel \
              --attestation "$evidence/$bp/proof-attestation.json"
          done

      - name: Sign attestations from the trusted main branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: pcvh
        run: |
          keys="$RUNNER_TEMP/pcvh-ci-keys"
          evidence="$RUNNER_TEMP/pcvh-dual-kernel"
          python -m pcvh keygen --out-dir "$keys"
          for bp in $BLUEPRINTS; do
            att="$evidence/$bp/proof-attestation.json"
            python -m pcvh sign "$att" --key "$keys/pcvh_signing.key.pem"
            python -m pcvh verify-sig "$att" --pubkey "$keys/pcvh_signing.pub.pem"
          done
          cp "$keys/pcvh_signing.pub.pem" "$evidence/"
          printf 'repository=%s\ncommit=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence/provenance.txt"

      - name: Upload signed dual-kernel evidence and public key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pcvh-dual-kernel-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pcvh-dual-kernel/*/proof-attestation.json
            ${{ runner.temp }}/pcvh-dual-kernel/pcvh_signing.pub.pem
            ${{ runner.temp }}/pcvh-dual-kernel/provenance.txt
          if-no-files-found: error
